<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento Pessoal — Painel</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#2a78d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --surface-1:#fcfcfb; --surface-2:#f9f9f7; --surface-3:#ffffff;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --success-text:#006300;
  --radius:10px;
  color-scheme:light;
}
[data-theme="dark"]{
  --surface-1:#1a1a19; --surface-2:#0d0d0d; --surface-3:#232322;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --success-text:#0ca30c;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background:var(--surface-2); color:var(--text-primary);
  min-height:100vh;
}
.app{display:flex; min-height:100vh;}
.sidebar{
  width:220px; flex:0 0 220px; background:var(--surface-1); border-right:1px solid var(--border);
  padding:20px 12px; display:flex; flex-direction:column; gap:4px;
}
.brand{font-weight:700; font-size:15px; padding:6px 10px 18px; color:var(--text-primary);}
.brand small{display:block; font-weight:400; color:var(--text-muted); font-size:11px; margin-top:2px;}
.navbtn{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; border:none;
  background:transparent; color:var(--text-secondary); font-size:14px; text-align:left; cursor:pointer;
  width:100%;
}
.navbtn:hover{background:var(--surface-3);}
.navbtn.active{background:var(--s1); color:#fff;}
.navbtn .ic{font-size:16px; width:18px; text-align:center;}
.sidebar-foot{margin-top:auto; padding-top:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:6px;}
.smallbtn{
  font-size:12.5px; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-3); color:var(--text-secondary); cursor:pointer; text-align:left;
}
.smallbtn:hover{color:var(--text-primary); border-color:var(--text-muted);}
.main{flex:1; padding:22px 28px 60px; max-width:1180px;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
.topbar h1{font-size:20px; margin:0;}
.topbar .sub{color:var(--text-secondary); font-size:13px; margin-top:2px;}
select, input[type=text], input[type=date], input[type=number]{
  font-family:inherit; font-size:13.5px; padding:7px 10px; border-radius:8px;
  border:1px solid var(--border); background:var(--surface-3); color:var(--text-primary);
  max-width:100%;
}
.formrow select, .formrow input{ width:100%; box-sizing:border-box; max-width:100%; }
button.btn{
  font-family:inherit; font-size:13.5px; padding:8px 14px; border-radius:8px; border:none;
  background:var(--s1); color:#fff; cursor:pointer; font-weight:600;
}
button.btn.secondary{background:var(--surface-3); color:var(--text-primary); border:1px solid var(--border); font-weight:500;}
button.btn.danger{background:transparent; color:var(--critical); border:1px solid var(--critical);}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:20px;}
.tile{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;}
.tile .label{font-size:12.5px; color:var(--text-secondary);}
.tile .value{font-size:26px; font-weight:600; margin-top:6px; font-variant-numeric:proportional-nums;}
.tile .value.pos{color:var(--success-text);}
.tile .value.neg{color:var(--critical);}
.card{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px;}
.card h2{font-size:14.5px; margin:0 0 14px; color:var(--text-primary);}
.card h2 small{font-weight:400; color:var(--text-muted); margin-left:6px;}
.grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
.grid2 > .card{min-width:0;}
@media(max-width:900px){.grid2{grid-template-columns:1fr;}}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-weight:600; color:var(--text-secondary); font-size:12px; padding:8px 10px; border-bottom:1px solid var(--grid);}
td{padding:8px 10px; border-bottom:1px solid var(--grid); color:var(--text-primary); font-variant-numeric:tabular-nums;}
tr:hover td{background:var(--surface-2);}
.tag{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; background:var(--surface-2); color:var(--text-secondary); border:1px solid var(--border);}
.val-pos{color:var(--success-text); font-weight:600;}
.val-neg{color:var(--text-primary);}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.formrow{display:grid; grid-template-columns:120px 110px minmax(0,140px) minmax(0,1.3fr) minmax(0,110px) 130px 90px; gap:8px; align-items:end; margin-bottom:14px;}
.formrow > div{min-width:0;}
.formrow label{display:block; font-size:11px; color:var(--text-muted); margin-bottom:3px;}
@media(max-width:1050px){.formrow{grid-template-columns:1fr 1fr; }}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--text-secondary);}
.legend .sw{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px;}
.barrow{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.barrow .lbl{width:170px; font-size:12.5px; color:var(--text-secondary); flex:0 0 170px; text-align:right; padding-right:2px;}
.barrow .track{flex:1; position:relative; height:20px;}
.barrow .fill{position:absolute; top:2px; height:16px; border-radius:4px; background:var(--s1);}
.barrow .num{width:82px; flex:0 0 82px; font-size:12.5px; text-align:left; font-variant-numeric:tabular-nums; color:var(--text-primary);}
.tabs{display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--border);}
.tabbtn{padding:9px 14px; font-size:13px; border:none; background:transparent; color:var(--text-secondary); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tabbtn.active{color:var(--s1); border-bottom-color:var(--s1); font-weight:600;}
.invoice{border:1px solid var(--border); border-radius:8px; margin-bottom:12px; overflow:hidden;}
.invoice summary{cursor:pointer; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; background:var(--surface-2); font-size:13.5px; list-style:none;}
.invoice summary::-webkit-details-marker{display:none;}
.invoice summary .tot{font-weight:700; font-variant-numeric:tabular-nums;}
.invoice .body{padding:4px 16px 14px;}
.pill{padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600;}
.pill.good{background:rgba(12,163,12,.12); color:var(--good);}
.pill.warn{background:rgba(250,178,25,.18); color:#a06600;}
.pill.late{background:rgba(208,59,59,.14); color:var(--critical);}
.pill.over{background:rgba(235,104,52,.16); color:var(--s2);}
.pill.plan{background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border);}
textarea.obsbox{width:100%; min-height:32px; font-family:inherit; font-size:12.5px; padding:6px 8px; border-radius:6px; border:1px solid var(--border); background:var(--surface-3); color:var(--text-primary); resize:vertical;}
select.inlinesel{font-size:12px; padding:4px 6px; border-radius:6px; border:1px solid var(--border); background:var(--surface-3); color:var(--text-primary); max-width:220px;}
.monthtabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:14px;}
.monthtabs button{padding:6px 12px; font-size:12.5px; border-radius:999px; border:1px solid var(--border); background:var(--surface-3); color:var(--text-secondary); cursor:pointer;}
.monthtabs button.active{background:var(--s1); color:#fff; border-color:var(--s1);}
.catmgr{border:1px dashed var(--border); border-radius:8px; padding:12px 14px; margin-top:8px;}
.catmgr-row{display:grid; grid-template-columns:1fr 1fr 90px 70px; gap:8px; margin-bottom:6px; align-items:center;}
.daybadge{font-size:10.5px; padding:1px 6px; border-radius:5px; background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border);}
.empty{color:var(--text-muted); font-size:13px; padding:20px; text-align:center;}
.tooltip{position:fixed; background:var(--text-primary); color:var(--surface-1); font-size:12px; padding:6px 10px; border-radius:6px; pointer-events:none; z-index:999; opacity:0; transition:opacity .1s; white-space:nowrap;}
.tooltip.show{opacity:1;}
.readme-box{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:12.5px; color:var(--text-secondary); margin-bottom:18px; line-height:1.5;}
.readme-box b{color:var(--text-primary);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--baseline); border-radius:6px;}
.footprint{font-size:11.5px; color:var(--text-muted); margin-top:24px; text-align:center;}
.calgrid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px;}
.calday{min-width:0;}
.calweekday{text-align:center; font-size:11px; font-weight:600; color:var(--text-muted); padding:2px 0 8px;}
.calday{border:1px solid var(--border); border-radius:8px; min-height:82px; padding:6px 7px; background:var(--surface-2);}
.calday.pad{background:transparent; border-color:transparent;}
.calday.today{border-color:var(--s1); border-width:2px; padding:5px 6px;}
.calday.future{background:var(--surface-1);}
.calnum{font-size:11.5px; color:var(--text-secondary); font-weight:600; margin-bottom:5px;}
.calamt{font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px;}
.calamt.pos{color:var(--success-text);}
.calamt.neg{color:var(--critical);}
@media(max-width:700px){.calgrid{gap:3px;} .calday{min-height:58px; padding:4px;} .calamt{font-size:9.5px;} .calweekday{font-size:9.5px;}}
.lockscreen{position:fixed; inset:0; background:var(--surface-2); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;}
.lockbox{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:32px 28px; width:100%; max-width:340px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,0.12);}
.lockbox h1{font-size:18px; margin:0 0 6px; color:var(--text-primary);}
.lockbox p{font-size:12.5px; color:var(--text-muted); margin:0 0 20px;}
.lockbox input{width:100%; font-size:20px; text-align:center; letter-spacing:6px; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-primary); margin-bottom:12px; box-sizing:border-box;}
.lockerr{color:var(--critical); font-size:12.5px; margin-top:10px; min-height:16px;}
.syncbox{margin-bottom:6px;}
.syncstatus{font-size:10.5px; color:var(--text-muted); padding:4px 2px 8px; line-height:1.4;}
.syncstatus.err{color:var(--critical);}
.syncstatus.ok{color:var(--good);}
.ocrbox{border:1px dashed var(--border); border-radius:8px; padding:14px; text-align:center; background:var(--surface-2); margin-bottom:14px;}
.ocrbox.busy{opacity:0.7;}
.ocrstatus{font-size:12px; color:var(--text-secondary); margin-top:8px; min-height:16px;}

/* ===== Modal genérico (rateio, etc.) ===== */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:1100; display:flex; align-items:center; justify-content:center; padding:16px;}
.modal-box{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; width:100%; max-width:480px; max-height:86vh; overflow-y:auto; box-shadow:0 10px 40px rgba(0,0,0,0.25);}
.modal-box h3{margin:0 0 4px;}
.rateiorow{display:grid; grid-template-columns:1fr 120px 32px; gap:8px; margin-bottom:8px; align-items:center;}
.rateioTotal{font-size:12.5px; color:var(--text-muted); margin-top:8px; padding-top:10px; border-top:1px solid var(--border);}
.rateioTotal.bad{color:var(--critical); font-weight:600;}
.inlinesel{max-width:220px;}
.tag.rateiotag{cursor:pointer;}

/* ===== Responsivo (celular) ===== */
.tblwrap{width:100%;}
.mobiletopbar{display:none;}
.sidebar-backdrop{display:none;}
.menutoggle{
  display:none; align-items:center; justify-content:center; width:36px; height:36px; flex:0 0 36px;
  border-radius:8px; border:1px solid var(--border); background:var(--surface-3); color:var(--text-primary);
  font-size:18px; cursor:pointer; padding:0;
}
@media(max-width:860px){
  .app{position:relative; flex-direction:column;}
  .mobiletopbar{
    display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surface-1);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:60;
  }
  .mobiletopbar .brand{padding:0; font-size:14px; flex:1;}
  .mobiletopbar .brand small{font-size:10.5px;}
  .menutoggle{display:inline-flex;}
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; z-index:500; width:78vw; max-width:280px;
    transform:translateX(-100%); transition:transform .22s ease; box-shadow:2px 0 24px rgba(0,0,0,0.22);
    overflow-y:auto;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{
    display:block; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:400;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sidebar-backdrop.show{opacity:1; pointer-events:auto;}
  .main{padding:14px 14px 50px; max-width:100%;}
  .card{padding:14px 14px;}
  .topbar h1{font-size:17px;}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;}
  .tile{padding:12px 14px;}
  .tile .value{font-size:20px;}
  .barrow .lbl{width:96px; flex:0 0 96px; font-size:11.5px;}
  .barrow .num{width:72px; flex:0 0 72px; font-size:11.5px;}
  .catmgr-row{grid-template-columns:1fr 1fr 66px 50px; font-size:12.5px;}
  .filters{gap:6px;}
  .filters select, .filters input{flex:1 1 140px; min-width:0;}
  .tblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -14px; padding:0 14px;}
  .tblwrap table{width:max-content; min-width:100%;}
  .tblwrap th, .tblwrap td{white-space:nowrap;}
  .tblwrap td textarea.obsbox{white-space:normal; min-width:160px;}
}
@media(max-width:420px){
  .lockbox{padding:26px 20px;}
  .lockbox input{font-size:18px; letter-spacing:4px;}
}
</style>
</head>
<body>
<div class="lockscreen" id="lockScreen">
  <div class="lockbox">
    <h1>💰 Orçamento Pessoal</h1>
    <p>Digite a senha para continuar</p>
    <form id="formLock" autocomplete="off">
      <input type="password" id="lockInput" inputmode="numeric" autocomplete="current-password" placeholder="Senha" autofocus>
      <button class="btn" type="submit" style="width:100%;">Entrar</button>
      <div class="lockerr" id="lockErr"></div>
    </form>
  </div>
</div>
<div class="app" id="appRoot" style="display:none;">
  <div class="mobiletopbar">
    <button class="menutoggle" id="btnMenuToggle" aria-label="Abrir menu">☰</button>
    <div class="brand">💰 Orçamento Pessoal<small id="acctSummaryMobile"></small></div>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="sidebar" id="sidebar">
    <div class="brand">💰 Orçamento Pessoal<small id="acctSummary"></small></div>
    <button class="navbtn active" data-tab="dashboard"><span class="ic">📊</span>Dashboard</button>
    <button class="navbtn" data-tab="lancamentos"><span class="ic">📝</span>Lançamentos</button>
    <button class="navbtn" data-tab="orcado"><span class="ic">🎯</span>Orçado x Realizado</button>
    <button class="navbtn" data-tab="aberto"><span class="ic">⏰</span>Em Aberto</button>
    <button class="navbtn" data-tab="fluxo"><span class="ic">📈</span>Fluxo de Caixa</button>
    <button class="navbtn" data-tab="faturas"><span class="ic">💳</span>Faturas por cartão</button>
    <button class="navbtn" data-tab="extratos"><span class="ic">🏦</span>Extratos por conta</button>
    <button class="navbtn" data-tab="emprestimos"><span class="ic">🤝</span>Empréstimos</button>
    <div class="sidebar-foot">
      <div class="syncbox" id="syncBox">
        <button class="smallbtn" id="btnConnectDrive">🔗 Conectar Google Drive</button>
        <div class="syncstatus" id="syncStatus"></div>
      </div>
      <button class="smallbtn" id="btnExport">⬇️ Exportar dados (JSON)</button>
      <button class="smallbtn" id="btnImport">⬆️ Importar dados (JSON)</button>
      <button class="smallbtn" id="btnTheme">🌓 Alternar tema</button>
      <button class="smallbtn" id="btnLock">🔒 Bloquear</button>
      <input type="file" id="fileImport" accept="application/json" style="display:none">
    </div>
  </div>
  <div class="main" id="main"></div>
</div>
<div class="tooltip" id="tooltip"></div>
<div class="modal-overlay" id="rateioOverlay" style="display:none;">
  <div class="modal-box">
    <h3>✂️ Ratear lançamento</h3>
    <div class="sub" id="rateioInfo" style="margin-bottom:12px;"></div>
    <div id="rateioRows"></div>
    <button class="btn secondary" type="button" id="btnRateioAddRow" style="margin-top:4px;">+ Categoria</button>
    <div class="rateioTotal" id="rateioTotalLine"></div>
    <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
      <button class="btn" id="btnRateioSalvar" type="button">Salvar rateio</button>
      <button class="btn secondary" id="btnRateioRemover" type="button">Remover rateio</button>
      <button class="btn secondary" id="btnRateioCancelar" type="button">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ===================== Estado =====================
const SEED = JSON.parse(document.getElementById('seed-data').textContent);
const LS_KEY = 'orcamento_pessoal_state_v1';
let state;
(function initState(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ saved = null; }
  state = saved || structuredClone(SEED);
})();
ensureDefaults();
let currentTab = 'dashboard';
let editingId = null;

// Garante contas/categorias do sistema mesmo em dados antigos importados (ex: carteira em dinheiro,
// categoria de transferência entre contas e de ajuste de saldo).
function ensureDefaults(){
  if(!state.accounts.find(a=>a.id==='carteira')){
    state.accounts.push({id:'carteira', name:'Carteira (dinheiro)', banco:'Dinheiro em espécie', saldoAtual:0, dataExtrato: state.dataBase || '2026-08-19'});
  }
  if(!state.categories.find(c=>c.id==='sys_transferencia')){
    state.categories.push({id:'sys_transferencia', nome:'Transferência entre contas', grupo:'Transferências internas', tipo:'transferencia'});
  }
  if(!state.categories.find(c=>c.id==='sys_ajuste_saldo')){
    state.categories.push({id:'sys_ajuste_saldo', nome:'Ajuste de saldo', grupo:'Ajustes', tipo:'transferencia'});
  }
  if(!state.categories.find(c=>c.id==='sys_emprestimo')){
    state.categories.push({id:'sys_emprestimo', nome:'Empréstimo concedido', grupo:'Empréstimos concedidos', tipo:'transferencia'});
  }
  if(!Array.isArray(state.emprestimos)) state.emprestimos = [];
  (state.cards||[]).forEach(c=>{ if(c.diaVencimento===undefined) c.diaVencimento = null; });
}

const fmt = (v) => (v<0?'-':'') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtDate = (d) => { const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; };
const catById = (id) => state.categories.find(c=>c.id===id);
const accById = (id) => state.accounts.find(a=>a.id===id);
const cardById = (id) => state.cards.find(c=>c.id===id);
const uid = () => Math.max(0,...state.lancamentos.map(l=>l.id)) + 1;
const emprestimoUid = () => Math.max(0,...state.emprestimos.map(e=>e.id)) + 1;

// Retorna a divisão de categorias de um lançamento: se ele tem rateio, usa as partes
// cadastradas; senão, trata como uma única "parte" igual ao próprio lançamento.
function rateioOf(l){
  if(l.rateio && l.rateio.length) return l.rateio;
  return [{categoriaId: l.categoriaId, valor: l.valor}];
}
// Competência (mês de referência) de um lançamento: usa o campo explícito quando
// existe; senão, cai para o mês do vencimento (fatura) ou da própria data.
function competenciaOf(l){
  return l.competencia || (l.origemTipo==='cartao' ? l.fatura : l.data.slice(0,7));
}
// Data de vencimento (YYYY-MM-DD) de uma fatura de um cartão, a partir do dia de
// vencimento cadastrado no cartão. Retorna null se o cartão ainda não tem esse dia definido.
function cardVencDate(cardId, faturaMes){
  const card = cardById(cardId);
  if(!card || !card.diaVencimento || !faturaMes) return null;
  const dim = daysInMonth(faturaMes);
  const dia = Math.min(card.diaVencimento, dim);
  return `${faturaMes}-${String(dia).padStart(2,'0')}`;
}

const SLOTS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function slotColor(i){ return cssVar(SLOTS[i % SLOTS.length]); }

// ===================== Orçamento — helpers =====================
const MESES_ORC = ['2026-08','2026-09','2026-10','2026-11','2026-12'];
function dataBase(){ return state.dataBase || '2026-08-19'; }
function orcById(id){ return state.orcamento.find(o=>o.id===id); }
function diaLabel(line){
  if(Array.isArray(line.diaVencimento)) return line.diaVencimento.join('/');
  if(line.diaVencimento===null) return line.frequencia==='semanal' ? 'semanal' : 'diário';
  return String(line.diaVencimento);
}
function daysInMonth(month){ const [y,m]=month.split('-').map(Number); return new Date(y,m,0).getDate(); }
function todayInfo(){ const [y,m,d] = dataBase().split('-').map(Number); return {y,m,d,month:`${y}-${String(m).padStart(2,'0')}`}; }

// soma de lançamentos (contas+cartões) ligados à categoria da linha, no mês informado
function realizadoForLine(line, month){
  return state.lancamentos
    .filter(l=> l.origemTipo==='cartao' ? l.fatura===month : l.data.slice(0,7)===month)
    .reduce((s,l)=>{
      const partes = rateioOf(l).filter(p=>p.categoriaId===line.categoriaId);
      return s + partes.reduce((ss,p)=>ss+p.valor,0);
    },0);
}
// ocorrências (dia, valor) previstas de uma linha orçamentária dentro de um mês
function occurrencesForLine(line, month){
  const orcado = line.valores[month];
  if(orcado===undefined || orcado===null) return [];
  const dim = daysInMonth(month);
  if(line.frequencia==='multi'){
    const dias = line.diaVencimento;
    return dias.map(d=>({dia:d, valor:orcado/dias.length}));
  }
  if(line.frequencia==='semanal'){
    const dias=[5,12,19,26].filter(d=>d<=dim);
    return dias.map(d=>({dia:d, valor:orcado/dias.length}));
  }
  if(line.frequencia==='diario'){
    return Array.from({length:dim},(_,i)=>({dia:i+1, valor:orcado/dim}));
  }
  return [{dia:line.diaVencimento, valor:orcado}];
}
// status de uma linha em um mês, relativo à data-base ("hoje")
function statusForLine(line, month){
  const cat = catById(line.categoriaId);
  const orcado = line.valores[month];
  const real = realizadoForLine(line, month);
  const {month: curMonth, d: hojeDia} = todayInfo();
  if(orcado===undefined && real===0) return {label:'—', pill:'plan', ok:true};
  if(Math.abs(real) > 0.005){
    if(orcado===undefined) return {label: cat.tipo==='receita'?'Recebido (não orçado)':'Pago (não orçado)', pill:'good'};
    const diff = Math.abs(real) - Math.abs(orcado);
    if(Math.abs(diff) < 0.01) return {label:'Pago - confere', pill:'good'};
    return {label: diff>0 ? 'Pago (acima do orçado)' : 'Pago (abaixo do orçado)', pill: diff>0?'over':'good'};
  }
  // sem realizado
  if(month < curMonth) return {label:'Sem dados no período carregado', pill:'plan'};
  if(month > curMonth) return {label:'Planejado', pill:'plan'};
  // mês corrente: comparar dia(s) de vencimento com hoje
  const occ = occurrencesForLine(line, month);
  if(occ.length===0) return {label:'—', pill:'plan'};
  if(line.frequencia==='semanal' || line.frequencia==='diario'){
    return {label:'Em andamento (parcial)', pill:'plan'};
  }
  const maxDia = Math.max(...occ.map(o=>o.dia));
  const minDiaFuturo = occ.map(o=>o.dia).filter(d=>d>=hojeDia).sort((a,b)=>a-b)[0];
  if(minDiaFuturo!==undefined) return {label:`A vencer (dia ${minDiaFuturo})`, pill:'warn'};
  return {label:`⚠ Atrasado (venceu dia ${maxDia})`, pill:'late'};
}

// ===================== Tooltip =====================
const tooltipEl = document.getElementById('tooltip');
function showTip(evt, html){
  tooltipEl.innerHTML = html;
  tooltipEl.classList.add('show');
  moveTip(evt);

// ===================== Senha de acesso =====================
// Trava simples do lado do cliente — não é criptografia de verdade (quem olhar o
// código-fonte da página consegue contornar). A senha real fica só como um hash aqui
// embaixo; pra trocar, gere um novo hash com simpleHash('sua-senha-nova') e substitua
// o valor de APP_PIN_HASH.
function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(16);
}

// ===================== Google Drive sync =====================
// Sincronização simples (mesmo modelo do painel de gestão): guarda um arquivo JSON no
// Google Drive do próprio usuário (escopo drive.file — só acessa arquivos criados por
// este app). Na primeira vez que este navegador conecta, TRAZ o que já estiver no Drive;
// depois disso, cada alteração local é enviada (push) automaticamente. Não faz merge:
// se você editar em dois aparelhos sem sincronizar entre as edições, o último a enviar
// vence — mesma limitação já aceita no painel de gestão.
const DRIVE_CFG = {
  clientId: '311182031830-gmhceor6h0ikf8v3d3pqpmbiobvescbf.apps.googleusercontent.com',
  scope: 'https://www.googleapis.com/auth/drive.file',
  fileName: 'orcamento-dados.json',
};
let driveState = {
  gapiReady:false, gisReady:false, tokenClient:null, token:null,
  fileId: localStorage.getItem('orc_drive_fileid') || null,
  syncing:false, lastSync:null, connected: localStorage.getItem('orc_drive_connected')==='1',
};

function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('Falha ao carregar '+src));
    document.head.appendChild(s);
  });
}

function updateSyncUi(){
  const statusEl = document.getElementById('syncStatus');
  const btn = document.getElementById('btnConnectDrive');
  if(!statusEl || !btn) return;
  if(driveState.syncing){
    statusEl.textContent = '🔄 Sincronizando...';
    statusEl.className = 'syncstatus';
  } else if(driveState.token){
    btn.textContent = '✅ Google Drive conectado';
    const when = driveState.lastSync ? driveState.lastSync.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—';
    statusEl.textContent = `Última sincronização: ${when}`;
    statusEl.className = 'syncstatus ok';
  } else {
    btn.textContent = '🔗 Conectar Google Drive';
    statusEl.textContent = driveState.connected ? 'Toque para reconectar' : 'Dados ficam só neste aparelho até conectar';
    statusEl.className = 'syncstatus';
  }
}

async function initDrive(){
  try{
    await Promise.all([
      loadScriptOnce('https://apis.google.com/js/api.js'),
      loadScriptOnce('https://accounts.google.com/gsi/client'),
    ]);
    await new Promise(res => gapi.load('client', res));
    await gapi.client.init({});
    await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/drive/v3/rest');
    driveState.gapiReady = true;
    driveState.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CFG.clientId,
      scope: DRIVE_CFG.scope,
      callback: async (resp) => {
        if(resp.error){ console.warn('Drive auth erro', resp); updateSyncUi(); return; }
        driveState.token = resp.access_token;
        gapi.client.setToken({access_token: resp.access_token});
        localStorage.setItem('orc_drive_connected','1');
        driveState.connected = true;
        await driveSyncPull();
      },
    });
    driveState.gisReady = true;
    if(driveState.connected){
      try{ driveState.tokenClient.requestAccessToken({prompt:''}); }catch(e){ /* precisa reconectar manualmente */ }
    }
  }catch(err){
    console.warn('Google Drive indisponível nesta sessão', err);
  }
  updateSyncUi();
}

function connectDrive(){
  if(!driveState.tokenClient){ alert('O Google Drive ainda está carregando — espere alguns segundos e tente de novo.'); return; }
  driveState.tokenClient.requestAccessToken({prompt:'consent'});
}

async function driveFindFile(){
  const res = await gapi.client.drive.files.list({
    q: `name='${DRIVE_CFG.fileName}' and trashed=false`,
    fields: 'files(id, modifiedTime)', spaces:'drive',
  });
  return (res.result.files && res.result.files[0]) || null;
}

async function driveSyncPull(){
  driveState.syncing = true; updateSyncUi();
  try{
    let fileId = driveState.fileId;
    if(!fileId){
      const f = await driveFindFile();
      if(f){ fileId = f.id; driveState.fileId = f.id; localStorage.setItem('orc_drive_fileid', f.id); }
    }
    if(!fileId){
      await driveSyncPush(); // primeira vez de todas: ainda não existe arquivo no Drive
    } else if(!localStorage.getItem('orc_synced_once')){
      const res = await gapi.client.drive.files.get({fileId, alt:'media'});
      const remote = typeof res.result === 'object' && res.result !== null ? res.result : JSON.parse(res.body);
      if(remote && remote.accounts && remote.lancamentos){
        state = remote;
        ensureDefaults();
        localStorage.setItem('orc_synced_once','1');
        render();
      }
    }
    driveState.lastSync = new Date();
  }catch(err){
    console.warn('Falha ao sincronizar com o Drive', err);
  }
  driveState.syncing = false;
  updateSyncUi();
}

async function driveSyncPush(){
  if(!driveState.token) return;
  driveState.syncing = true; updateSyncUi();
  try{
    const content = JSON.stringify(state);
    if(driveState.fileId){
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveState.fileId}?uploadType=media`, {
        method:'PATCH',
        headers:{ 'Authorization':'Bearer '+driveState.token, 'Content-Type':'application/json' },
        body: content,
      });
    } else {
      const boundary = 'orcbnd' + Date.now();
      const metadata = { name: DRIVE_CFG.fileName, mimeType:'application/json' };
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method:'POST',
        headers:{ 'Authorization':'Bearer '+driveState.token, 'Content-Type':`multipart/related; boundary=${boundary}` },
        body,
      });
      const json = await res.json();
      if(json.id){ driveState.fileId = json.id; localStorage.setItem('orc_drive_fileid', json.id); }
    }
    localStorage.setItem('orc_synced_once','1');
    driveState.lastSync = new Date();
  }catch(err){
    console.warn('Falha ao enviar para o Drive', err);
  }
  driveState.syncing = false;
  updateSyncUi();
}

// Expande lançamentos com rateio em uma "parte" por categoria, preservando os demais
// campos (data, descrição etc.) — usado nas agregações por categoria/grupo do dashboard.
function expandRateio(list){
  const out = [];
  list.forEach(l=>{
    rateioOf(l).forEach(p=>{
      out.push(Object.assign({}, l, {categoriaId: p.categoriaId, valor: p.valor}));
    });
  });
  return out;
}

function viewDashboard(){
  const months = availableMonths();
  const month = months[months.length-1] || '2026-08';
  const contaTx = expandRateio(state.lancamentos.filter(l=>l.origemTipo==='conta' && l.data.slice(0,7)===month));
  const receitas = contaTx.filter(l=>l.valor>0 && catById(l.categoriaId).tipo==='receita');
  const despesasConta = contaTx.filter(l=>l.valor<0 && catById(l.categoriaId).tipo!=='transferencia');
  const cartaoTx = expandRateio(state.lancamentos.filter(l=>l.origemTipo==='cartao' && l.fatura===month));
  const despesasCartao = cartaoTx.filter(l=>l.valor<0 && catById(l.categoriaId).tipo!=='transferencia');
  const creditosCartao = cartaoTx.filter(l=>l.valor>0);

  const totalReceita = receitas.reduce((s,l)=>s+l.valor,0);
  const totalDespesa = despesasConta.reduce((s,l)=>s+Math.abs(l.valor),0) + despesasCartao.reduce((s,l)=>s+Math.abs(l.valor),0) - creditosCartao.reduce((s,l)=>s+l.valor,0);
  const saldoMes = totalReceita - totalDespesa;
  const saldoContas = state.accounts.reduce((s,a)=>s+a.saldoAtual,0);

  // gastos por grupo (conta + cartão, despesas)
  const allDespesas = [...despesasConta, ...despesasCartao];
  const byGrupo = {};
  allDespesas.forEach(l=>{
    const g = catById(l.categoriaId).grupo;
    byGrupo[g] = (byGrupo[g]||0) + Math.abs(l.valor);
  });
  let grupoArr = Object.entries(byGrupo).sort((a,b)=>b[1]-a[1]);
  if(grupoArr.length>7){
    const top = grupoArr.slice(0,7);
    const outros = grupoArr.slice(7).reduce((s,[,v])=>s+v,0);
    grupoArr = [...top, ['Outros grupos', outros]];
  }
  const maxGrupo = Math.max(...grupoArr.map(g=>g[1]), 1);

  // gastos por categoria (mais granular que grupo) — para o gráfico de rosca
  const byCategoria = {};
  allDespesas.forEach(l=>{
    const nome = catById(l.categoriaId).nome;
    byCategoria[nome] = (byCategoria[nome]||0) + Math.abs(l.valor);
  });
  let catArr = Object.entries(byCategoria).sort((a,b)=>b[1]-a[1]);
  if(catArr.length>7){
    const top = catArr.slice(0,7);
    const outras = catArr.slice(7).reduce((s,[,v])=>s+v,0);
    catArr = [...top, ['Outras categorias', outras]];
  }
  const totalCategorias = catArr.reduce((s,[,v])=>s+v,0);

  // top gastos individuais
  const topGastos = [...allDespesas].sort((a,b)=>Math.abs(b.valor)-Math.abs(a.valor)).slice(0,8);

  // fluxo diário (contas) — receitas x despesas por dia
  const byDay = {};
  contaTx.forEach(l=>{
    byDay[l.data] = byDay[l.data] || {r:0,d:0};
    if(l.valor>0) byDay[l.data].r += l.valor; else byDay[l.data].d += Math.abs(l.valor);
  });
  const days = Object.keys(byDay).sort();
  const maxDay = Math.max(...days.map(d=>Math.max(byDay[d].r, byDay[d].d)), 1);

  return `
    <div class="topbar">
      <div><h1>Dashboard</h1><div class="sub">Mês de referência: ${monthLabel(month)} · dados até ${SEED.accounts[0].dataExtrato ? fmtDate(SEED.accounts[0].dataExtrato) : ''}</div></div>
    </div>
    <div class="readme-box"><b>Como ler:</b> este painel usa os lançamentos de contas (extratos) e cartões (faturas) do mês selecionado. Itens sem correspondência no orçamento original ficam no grupo <b>"Outros (não orçado)"</b>.</div>
    <div class="tiles">
      <div class="tile"><div class="label">Receitas do mês</div><div class="value pos">${fmt(totalReceita)}</div></div>
      <div class="tile"><div class="label">Despesas do mês</div><div class="value neg">${fmt(totalDespesa)}</div></div>
      <div class="tile"><div class="label">Saldo do mês</div><div class="value ${saldoMes>=0?'pos':'neg'}">${fmt(saldoMes)}</div></div>
      <div class="tile"><div class="label">Saldo total em contas (hoje)</div><div class="value">${fmt(saldoContas)}</div></div>
    </div>
    <div class="card">
      <h2>Despesas por categoria <small>contas + cartões, ${monthLabel(month)}</small></h2>
      ${categoriaDonutChart(catArr, totalCategorias)}
    </div>
    <div class="grid2">
      <div class="card">
        <h2>Despesas por grupo <small>contas + cartões, ${monthLabel(month)}</small></h2>
        ${grupoArr.map(([g,v],i)=>`
          <div class="barrow" data-tip="${g}: ${fmt(v)}">

        ${topGastos.map(l=>`<tr><td>${fmtDate(l.data)}</td><td>${l.descricao}</td><td style="text-align:right">${fmt(Math.abs(l.valor))}</td></tr>`).join('') || '<tr><td class="empty">Sem dados</td></tr>'}

      <h2>Fluxo diário nas contas <small>receitas x despesas, ${monthLabel(month)}</small></h2>

      </div>
    </div>

}

function monthLabel(m){
  const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const [y,mm] = m.split('-');
  return `${meses[parseInt(mm)-1]}/${y.slice(2)}`;
}

function dailyFlowChart(days, byDay, maxVal){
  if(days.length===0) return '<div class="empty">Sem lançamentos de conta nesse mês</div>';
  const w = 900, h = 160, barW = Math.min(22, (w/days.length)-6), gap=6;
  const zero = h/2;
  const scale = (h/2 - 8) / maxVal;
  let bars = '';
  days.forEach((d,i)=>{
    const x = i*(barW*2+gap);
    const r = byDay[d].r, de = byDay[d].d;
    const rH = r*scale, dH = de*scale;
    bars += `<rect data-tip="${fmtDate(d)} · Receitas: ${fmt(r)}" x="${x}" y="${zero-rH}" width="${barW}" height="${Math.max(rH,1)}" rx="3" fill="${cssVar('--s1')}" class="bar"></rect>`;
    bars += `<rect data-tip="${fmtDate(d)} · Despesas: ${fmt(de)}" x="${x+barW+2}" y="${zero}" width="${barW}" height="${Math.max(dH,1)}" rx="3" fill="${cssVar('--s8')}" class="bar"></rect>`;
  });
  const totalW = days.length*(barW*2+gap);
  return `<div style="overflow-x:auto"><svg width="${Math.max(totalW,300)}" height="${h}" viewBox="0 0 ${Math.max(totalW,300)} ${h}" style="min-width:100%">
    <line x1="0" y1="${zero}" x2="${totalW}" y2="${zero}" stroke="${cssVar('--baseline')}" stroke-width="1"/>
    ${bars}
  </svg></div>`;
}

function categoriaDonutChart(entries, total){
  if(!entries.length || total<=0) return '<div class="empty">Sem despesas nesse mês</div>';
  const r = 62, cx = 80, cy = 80, C = 2*Math.PI*r;
  let acc = 0;
  const segs = entries.map(([label,v],i)=>{
    const frac = v/total;
    const dash = Math.max(frac*C - 1.5, 0); // pequeno gap entre fatias
    const seg = `<circle data-tip="${label}: ${fmt(v)} (${(frac*100).toFixed(1)}%)" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${slotColor(i)}" stroke-width="26" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" class="donutseg"></circle>`;
    acc += frac*C;
    return seg;
  }).join('');
  const legend = entries.map(([label,v],i)=>`
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:7px; font-size:13px;">
      <span style="width:10px; height:10px; border-radius:50%; background:${slotColor(i)}; flex-shrink:0;"></span>
      <span style="flex:1; color:var(--text-secondary);">${label}</span>
      <span style="font-weight:600;">${fmt(v)}</span>
    </div>`).join('');
  return `
    <div style="display:flex; gap:28px; flex-wrap:wrap; align-items:center;">
      <svg width="160" height="160" viewBox="0 0 160 160" style="flex-shrink:0;">
        <g transform="rotate(-90 ${cx} ${cy})">${segs}</g>
        <text x="${cx}" y="${cy-4}" text-anchor="middle" style="font-size:11px; fill:var(--text-muted);">Total</text>
        <text x="${cx}" y="${cy+12}" text-anchor="middle" style="font-size:12px; font-weight:700; fill:var(--text-primary);">${fmt(total)}</text>
      </svg>
      <div style="flex:1; min-width:220px;">${legend}</div>
    </div>`;
}

function refreshOrigemOptions(){
  const tipo = document.getElementById('selOrigemTipo').value;
  const sel = document.getElementById('selOrigemId');
  const list = tipo==='conta' ? state.accounts : state.cards;
  sel.innerHTML = list.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
  const grpParcelas = document.getElementById('grpParcelas');
  if(grpParcelas) grpParcelas.style.display = tipo==='cartao' ? '' : 'none';
  atualizarCompetenciaSugerida();
}
// Sugere a competência (mês de referência) a partir da data/origem escolhidas no formulário —
// o usuário pode sempre sobrescrever antes de salvar.
function atualizarCompetenciaSugerida(){
  const form = document.getElementById('formNovo');
  if(!form) return;
  const inp = document.getElementById('inpCompetencia');
  if(!inp || inp.dataset.tocado==='1') return;
  const data = form.querySelector('[name=data]').value;
  if(data) inp.value = data.slice(0,7);
}

// Gera N-1 lançamentos futuros (parcelas 2..N) a partir de um lançamento de cartão recém-criado,
// avançando a fatura (e a competência) mês a mês. O valor de cada parcela é o mesmo informado no formulário.
function gerarParcelasFuturas(base, totalParcelas){
  const criados = [base];
  let [fy, fm] = base.fatura.split('-').map(Number);
  for(let i=2;i<=totalParcelas;i++){
    fm++; if(fm>12){ fm=1; fy++; }
    const fatura = `${fy}-${String(fm).padStart(2,'0')}`;
    const item = {
      ...base,
      id: uid(),
      descricao: `${base.descricaoBase} (parcela ${i}/${totalParcelas})`,
      fatura,
      vencimento: cardVencDate(base.origemId, fatura),
      competencia: fatura,
    };
    delete item.descricaoBase;
    state.lancamentos.push(item);
    criados.push(item);
  }
  return criados;
}

// Cria duas pontas ligadas (saída + entrada) para mover dinheiro entre contas próprias
// (ex: banco -> carteira). Não conta como receita/despesa (categoria tipo "transferencia").
function transferir({data, deId, paraId, valor, descricao}){
  const v = Math.round(Math.abs(parseFloat(valor))*100)/100;
  const contaDe = accById(deId), contaPara = accById(paraId);
  if(!v || !contaDe || !contaPara || deId===paraId) return false;
  const grupoTransferId = 'tr_' + Date.now() + '_' + Math.floor(Math.random()*10000);
  const idSaida = uid();
  state.lancamentos.push({
    id: idSaida, data, origemTipo:'conta', origemId: deId, categoriaId:'sys_transferencia',
    descricao: descricao ? `Transferência para ${contaPara.name} — ${descricao}` : `Transferência para ${contaPara.name}`,
    valor: -v, fatura:null, vencimento:null, grupoTransferId,
  });
  contaDe.saldoAtual = Math.round((contaDe.saldoAtual - v)*100)/100;
  const idEntrada = uid();
  state.lancamentos.push({
    id: idEntrada, data, origemTipo:'conta', origemId: paraId, categoriaId:'sys_transferencia',
    descricao: descricao ? `Transferência de ${contaDe.name} — ${descricao}` : `Transferência de ${contaDe.name}`,
    valor: v, fatura:null, vencimento:null, grupoTransferId,
  });
  contaPara.saldoAtual = Math.round((contaPara.saldoAtual + v)*100)/100;
  return true;
}

// Lê o texto de um cupom fiscal (já extraído por OCR) e tenta achar valor total, data e
// uma descrição razoável. Heurística simples — sempre deixa o usuário conferir antes de salvar.
function parseCupomText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
  const moneyRe = /(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/g;
  const toNumber = str => parseFloat(str.replace(/\./g,'').replace(',','.'));

  let valor = null;
  const totalLine = lines.find(l=>{
    const n = semAcento(l);
    return n.includes('TOTAL') && !n.includes('SUBTOTAL') && !n.includes('SUB TOTAL');
  });
  if(totalLine){
    const matches = totalLine.match(moneyRe);
    if(matches) valor = toNumber(matches[matches.length-1]);
  }
  if(valor===null){
    const allMatches = text.match(moneyRe);
    if(allMatches && allMatches.length) valor = Math.max(...allMatches.map(toNumber));
  }

  let data = null;
  const dm = text.match(/\b(\d{2})[\/.\-](\d{2})[\/.\-](\d{2,4})\b/);
  if(dm){
    let [, dd, mm, yy] = dm;
    if(yy.length===2) yy = '20'+yy;
    data = `${yy}-${mm}-${dd}`;
  }

  const descricao = lines.find(l=>/[A-Za-zÀ-ÿ]{3,}/.test(l) && l.length<=40) || 'Cupom fiscal';
  return {valor, data, descricao};
}

function wireLancamentos(){
  refreshOrigemOptions();
  document.getElementById('selOrigemTipo').addEventListener('change', refreshOrigemOptions);
  document.getElementById('formNovo').querySelector('[name=data]').addEventListener('change', atualizarCompetenciaSugerida);
  document.getElementById('inpCompetencia').addEventListener('input', (e)=>{ e.target.dataset.tocado='1'; });
  document.getElementById('btnOcr').addEventListener('click', ()=> document.getElementById('ocrFile').click());
  document.getElementById('ocrFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const box = document.getElementById('ocrBox');
    const status = document.getElementById('ocrStatus');
    box.classList.add('busy');
    status.textContent = '🔎 Carregando leitor de texto...';
    try{
      await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js');
      status.textContent = '🔎 Lendo o cupom... isso pode levar alguns segundos.';
      const { data: { text } } = await Tesseract.recognize(file, 'por');
      const parsed = parseCupomText(text);
      const form = document.getElementById('formNovo');
      if(parsed.data) form.querySelector('[name=data]').value = parsed.data;
      if(parsed.valor!==null) form.querySelector('[name=valor]').value = (-Math.abs(parsed.valor)).toFixed(2);
      form.querySelector('[name=descricao]').value = parsed.descricao;
      form.scrollIntoView({behavior:'smooth', block:'center'});
      form.querySelector('[name=valor]').focus();
      status.textContent = parsed.valor!==null
        ? '✅ Confira os campos no formulário "Novo lançamento" abaixo (valor, data, categoria e conta) e clique em Adicionar.'
        : '⚠️ Não consegui achar o valor no cupom — preencha manualmente no formulário abaixo.';
    }catch(err){
      console.warn('OCR falhou', err);
      status.textContent = '⚠️ Não consegui ler essa foto (tente uma mais nítida). Preencha manualmente no formulário abaixo.';
    }
    box.classList.remove('busy');
    e.target.value = '';
  });
  document.getElementById('formNovo').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const origemTipo = fd.get('origemTipo');
    const data = fd.get('data');
    const fatura = origemTipo==='cartao' ? data.slice(0,7) : null;
    const competencia = fd.get('competencia') || (fatura || data.slice(0,7));
    const totalParcelas = origemTipo==='cartao' ? Math.max(1, parseInt(fd.get('parcelas'))||1) : 1;
    const descricaoBase = fd.get('descricao');
    const item = {
      id: uid(),
      data,
      origemTipo,
      origemId: fd.get('origemId'),
      categoriaId: fd.get('categoriaId'),
      descricao: totalParcelas>1 ? `${descricaoBase} (parcela 1/${totalParcelas})` : descricaoBase,
      valor: parseFloat(fd.get('valor')),
      fatura,
      vencimento: origemTipo==='cartao' ? cardVencDate(fd.get('origemId'), fatura) : null,
      competencia,
    };
    if(origemTipo==='conta'){
      const acc = accById(item.origemId);
      if(acc) acc.saldoAtual = Math.round((acc.saldoAtual + item.valor)*100)/100;
    }
    state.lancamentos.push(item);
    if(origemTipo==='cartao' && totalParcelas>1){
      gerarParcelasFuturas({...item, descricaoBase}, totalParcelas);
    }
    e.target.querySelector('[name=parcelas]').value = 1;
    document.getElementById('inpCompetencia').dataset.tocado = '';
    render();
  });
  document.getElementById('formTransfer').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const deId = fd.get('deId'), paraId = fd.get('paraId');
    const valor = parseFloat(fd.get('valor'));
    if(deId===paraId){ alert('Escolha contas diferentes em "De" e "Para".'); return; }
    if(!valor || valor<=0){ alert('Informe um valor de transferência maior que zero.'); return; }
    transferir({data: fd.get('data'), deId, paraId, valor, descricao: fd.get('descricao')});
    e.target.reset();
    render();
  });
  wireCatMgr();
}

function wireCatMgr(){
  document.querySelectorAll('[data-cat-nome]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const c = catById(inp.dataset.catNome);
      if(c){ c.nome = inp.value; render(); }
    });
  });
  document.querySelectorAll('[data-cat-grupo]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const c = catById(inp.dataset.catGrupo);
      if(c){ c.grupo = inp.value; render(); }
    });
  });
  document.querySelectorAll('[data-cat-tipo]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const c = catById(sel.dataset.catTipo);
      if(c){ c.tipo = sel.value; render(); }
    });
  });
  document.querySelectorAll('[data-cat-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.catDel;
      const emUso = state.lancamentos.some(l=>rateioOf(l).some(p=>p.categoriaId===id)) || state.orcamento.some(o=>o.categoriaId===id);
      if(emUso){ alert('Essa categoria está em uso em lançamentos ou no orçamento — reatribua-os antes de excluir.'); return; }
      state.categories = state.categories.filter(c=>c.id!==id);
      render();
    });
  });
  document.getElementById('btnAddCat').addEventListener('click', ()=>{
    const nome = document.getElementById('novaCatNome').value.trim();
    const grupo = document.getElementById('novaCatGrupo').value.trim() || 'Outros (não orçado)';
    const tipo = document.getElementById('novaCatTipo').value;
    if(!nome){ alert('Digite um nome para a categoria.'); return; }
    const id = 'custom_' + nome.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') + '_' + Date.now().toString(36);
    state.categories.push({id, nome, grupo, tipo});
    render();
  });
}
// Exclui um lançamento (usado nas telas de Extratos e Faturas). Se ele fizer parte de uma
// transferência entre contas, remove as duas pontas e desfaz o efeito em ambos os saldos.
function excluirLancamento(id){
  const idx = state.lancamentos.findIndex(l=>l.id===id);
  if(idx<0) return;
  const l = state.lancamentos[idx];
  if(l.grupoTransferId){
    if(!confirm('Esse lançamento faz parte de uma transferência entre contas. Excluir remove as duas pontas (saída e entrada). Continuar?')) return;
    state.lancamentos.filter(x=>x.grupoTransferId===l.grupoTransferId).forEach(x=>{
      if(x.origemTipo==='conta'){
        const acc = accById(x.origemId);
        if(acc) acc.saldoAtual = Math.round((acc.saldoAtual - x.valor)*100)/100;
      }
    });
    state.lancamentos = state.lancamentos.filter(x=>x.grupoTransferId!==l.grupoTransferId);
    render();
    return;
  }
  if(l.origemTipo==='conta'){
    const acc = accById(l.origemId);
    if(acc) acc.saldoAtual = Math.round((acc.saldoAtual - l.valor)*100)/100;
  }
  state.lancamentos.splice(idx,1);
  render();
}

// Célula de categoria reutilizada nas tabelas de Extratos e Faturas: um <select> simples
// quando o lançamento tem uma única categoria, ou um resumo clicável quando está rateado
// entre várias (clique abre o editor de rateio).
function categoriaCellHTML(l){
  if(l.rateio && l.rateio.length>1){
    const resumo = l.rateio.map(p=>`${catById(p.categoriaId).nome}: ${fmt(p.valor)}`).join(' · ');
    return `<span class="tag rateiotag" data-tip="${resumo}" data-rateio-edit="${l.id}">✂️ Rateio (${l.rateio.length})</span>`;
  }
  return `<div style="display:flex; gap:4px; align-items:center;">
    <select class="inlinesel" data-editcat="${l.id}">${state.categories.map(c=>`<option value="${c.id}" ${c.id===l.categoriaId?'selected':''}>${c.grupo} — ${c.nome}</option>`).join('')}</select>
    <button class="btn secondary" type="button" style="padding:3px 7px; font-size:11px;" data-rateio-edit="${l.id}" title="Ratear entre categorias">✂️</button>
  </div>`;
}
// Célula de competência (mês de referência), editável — pode ser diferente do vencimento/data.
function competenciaCellHTML(l){
  return `<input type="month" class="inlinesel" style="max-width:130px" data-editcompetencia="${l.id}" value="${competenciaOf(l)}">`;
}
// Liga os eventos das células de categoria/competência/exclusão para uma lista de linhas
// já renderizadas na tela (Extratos ou Faturas).
function wireLinhasLancamento(container){
  container.querySelectorAll('[data-editcat]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const l = state.lancamentos.find(x=>x.id===parseInt(sel.dataset.editcat));
      if(l) l.categoriaId = sel.value;
    });
  });
  container.querySelectorAll('[data-editcompetencia]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const l = state.lancamentos.find(x=>x.id===parseInt(inp.dataset.editcompetencia));
      if(l) l.competencia = inp.value;
    });
  });
  container.querySelectorAll('[data-rateio-edit]').forEach(el=>{
    el.addEventListener('click', ()=> openRateioEditor(parseInt(el.dataset.rateioEdit)));
  });
  container.querySelectorAll('[data-del-lanc]').forEach(btn=>{
    btn.addEventListener('click', ()=> excluirLancamento(parseInt(btn.dataset.delLanc)));
  });
}

// ===================== Rateio (divisão de um lançamento entre categorias) =====================
let rateioTargetId = null;
function openRateioEditor(id){
  const l = state.lancamentos.find(x=>x.id===id);
  if(!l) return;
  rateioTargetId = id;
  document.getElementById('rateioInfo').textContent = `${fmtDate(l.data)} · ${l.descricao} · total ${fmt(l.valor)}`;
  const rows = document.getElementById('rateioRows');
  const partes = (l.rateio && l.rateio.length) ? l.rateio : [{categoriaId: l.categoriaId, valor: l.valor}];
  rows.innerHTML = partes.map(p=>rateioRowHTML(p.categoriaId, p.valor)).join('');
  wireRateioRows();
  atualizarRateioTotal();
  document.getElementById('rateioOverlay').style.display = 'flex';
}
function rateioRowHTML(categoriaId, valor){
  return `<div class="rateiorow">
    <select class="rateio-cat">${state.categories.map(c=>`<option value="${c.id}" ${c.id===categoriaId?'selected':''}>${c.grupo} — ${c.nome}</option>`).join('')}</select>
    <input type="number" step="0.01" class="rateio-valor" value="${valor}">
    <button class="btn danger" type="button" style="padding:4px 6px;" data-rateio-rm>✕</button>
  </div>`;
}
function wireRateioRows(){
  const rows = document.getElementById('rateioRows');
  rows.querySelectorAll('[data-rateio-rm]').forEach(btn=>{
    btn.onclick = ()=>{ btn.closest('.rateiorow').remove(); atualizarRateioTotal(); };
  });
  rows.querySelectorAll('.rateio-valor').forEach(inp=>{ inp.oninput = atualizarRateioTotal; });
}
function atualizarRateioTotal(){
  const l = state.lancamentos.find(x=>x.id===rateioTargetId);
  if(!l) return;
  const valores = [...document.querySelectorAll('#rateioRows .rateio-valor')].map(i=>parseFloat(i.value)||0);
  const soma = Math.round(valores.reduce((s,v)=>s+v,0)*100)/100;
  const diff = Math.round((soma - l.valor)*100)/100;
  const line = document.getElementById('rateioTotalLine');
  line.textContent = `Soma das partes: ${fmt(soma)} de ${fmt(l.valor)}${Math.abs(diff)>0.005 ? ` — diferença de ${fmt(diff)}` : ' ✓'}`;
  line.className = 'rateioTotal' + (Math.abs(diff)>0.005 ? ' bad' : '');
  return Math.abs(diff)<=0.005;
}
function closeRateioEditor(){
  document.getElementById('rateioOverlay').style.display = 'none';
  rateioTargetId = null;
}
function wireRateioModal(){
  document.getElementById('btnRateioAddRow').addEventListener('click', ()=>{
    const l = state.lancamentos.find(x=>x.id===rateioTargetId);
    document.getElementById('rateioRows').insertAdjacentHTML('beforeend', rateioRowHTML(l ? l.categoriaId : state.categories[0].id, 0));
    wireRateioRows();
    atualizarRateioTotal();
  });
  document.getElementById('btnRateioCancelar').addEventListener('click', closeRateioEditor);
  document.getElementById('btnRateioRemover').addEventListener('click', ()=>{
    const l = state.lancamentos.find(x=>x.id===rateioTargetId);
    if(l){ delete l.rateio; }
    closeRateioEditor();
    render();
  });
  document.getElementById('btnRateioSalvar').addEventListener('click', ()=>{
    const l = state.lancamentos.find(x=>x.id===rateioTargetId);
    if(!l) return;
    const rows = [...document.querySelectorAll('#rateioRows .rateiorow')];
    if(rows.length<2){ alert('Adicione pelo menos 2 categorias para ratear, ou use "Remover rateio".'); return; }
    if(!atualizarRateioTotal()){ alert('A soma das partes precisa bater com o valor total do lançamento antes de salvar.'); return; }
    const rateio = rows.map(r=>({
      categoriaId: r.querySelector('.rateio-cat').value,
      valor: Math.round((parseFloat(r.querySelector('.rateio-valor').value)||0)*100)/100,
    }));
    l.rateio = rateio;
    l.categoriaId = rateio[0].categoriaId; // mantém compatibilidade com telas/relatórios antigos
    closeRateioEditor();
    render();
  });
}
wireRateioModal();

// ===================== Orçado x Realizado =====================
let orcMonth = null;
function viewOrcado(){
  if(!orcMonth) orcMonth = todayInfo().month;

function wireOrcado(){
  document.querySelectorAll('#orcMonthTabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ orcMonth = b.dataset.m; render(); });
  });
  document.querySelectorAll('[data-obs]').forEach(ta=>{
    ta.addEventListener('change', ()=>{
      const line = orcById(parseInt(ta.dataset.obs));
      if(line) line.observacao = ta.value;
    });
  });
  const btnCopiar = document.getElementById('btnCopiarMesAnt');
  if(btnCopiar) btnCopiar.addEventListener('click', copiarMesAnterior);
}

function copiarMesAnterior(){
  const idx = MESES_ORC.indexOf(orcMonth);
  if(idx<=0){ alert('Não há um mês anterior no orçamento para copiar.'); return; }
  const mesAnterior = MESES_ORC[idx-1];
  let copiados = 0, semDadoAnterior = 0;
  state.orcamento.forEach(line=>{
    if(line.valores[orcMonth]===undefined){
      if(line.valores[mesAnterior]!==undefined){
        line.valores[orcMonth] = line.valores[mesAnterior];
        copiados++;
      } else {
        semDadoAnterior++;
      }
    }
  });
  if(copiados===0){
    alert(semDadoAnterior>0
      ? `Nenhuma linha copiada: as linhas sem valor em ${monthLabel(orcMonth)} também não têm valor em ${monthLabel(mesAnterior)}.`
      : `Todas as linhas de ${monthLabel(orcMonth)} já têm valores definidos — nada para copiar.`);
    return;
  }
  render();
  alert(`${copiados} linha(s) preenchida(s) em ${monthLabel(orcMonth)} com os valores de ${monthLabel(mesAnterior)}.${semDadoAnterior>0 ? ` (${semDadoAnterior} linha(s) continuam sem valor, pois ${monthLabel(mesAnterior)} também não tinha.)` : ''}`);
}

// ===================== Fluxo de Caixa dia a dia =====================
function computeDailyCashflow(){
  const contaTx = state.lancamentos.filter(l=>l.origemTipo==='conta');
  if(contaTx.length===0) return [];
  const minDate = contaTx.reduce((m,l)=>l.data<m?l.data:m, contaTx[0].data);
  const start = minDate < '2026-08-01' ? minDate : '2026-08-01';
  const end = '2026-12-31';
  const hoje = dataBase();

  // agrupa reais por dia (transferências entre contas próprias não contam como entrada/saída,
  // pois não alteram o total combinado das contas — só aparecem no extrato de cada conta)
  const realByDay = {};
  contaTx.forEach(l=>{
    rateioOf(l).forEach(p=>{
      if(catById(p.categoriaId).tipo==='transferencia') return;
      (realByDay[l.data] = realByDay[l.data]||[]).push({descricao:l.descricao, valor:p.valor});
    });
  });

  // agrupa projeções por dia (linhas de orçamento, apenas dias > hoje)
  const projByDay = {};
  state.orcamento.forEach(line=>{
    MESES_ORC.forEach(month=>{
      occurrencesForLine(line, month).forEach(occ=>{
        const dstr = `${month}-${String(occ.dia).padStart(2,'0')}`;
        if(dstr <= hoje) return; // só projeta o futuro
        const cat = catById(line.categoriaId);
        const sinal = cat.tipo==='receita' ? 1 : -1;
        (projByDay[dstr] = projByDay[dstr]||[]).push({descricao: cat.nome, valor: occ.valor*sinal, categoriaId: line.categoriaId});
      });
    });
  });

  // projeta faturas de cartão em aberto (com base no dia de vencimento cadastrado no
  // cartão) como uma saída única no fluxo, na data de vencimento — soma do que já
  // está lançado naquela fatura até agora.
  const invoiceTotals = {};
  state.lancamentos.filter(l=>l.origemTipo==='cartao' && l.fatura).forEach(l=>{
    const key = l.origemId+'|'+l.fatura;
    invoiceTotals[key] = (invoiceTotals[key]||0) + l.valor;
  });
  Object.entries(invoiceTotals).forEach(([key, total])=>{
    const [cardId, mes] = key.split('|');
    const vdate = cardVencDate(cardId, mes);
    if(!vdate || vdate <= hoje) return; // só projeta faturas com vencimento futuro
    if(total >= -0.005) return; // fatura sem saldo devedor (só créditos/estornos)
    const card = cardById(cardId);
    (projByDay[vdate] = projByDay[vdate]||[]).push({descricao: `Fatura ${card ? card.name : cardId} (${monthLabel(mes)})`, valor: total});
  });

  const saldoHojeContas = state.accounts.reduce((s,a)=>s+a.saldoAtual,0);
  const realNetTotal = contaTx.reduce((s,l)=>s+l.valor,0);
  let saldo = Math.round((saldoHojeContas - realNetTotal)*100)/100; // saldo estimado no início do período carregado

  const out = [];
  let [cy,cm,cd] = start.split('-').map(Number);
  const nextDay = () => {
    const dim = daysInMonth(`${cy}-${String(cm).padStart(2,'0')}`);
    cd++; if(cd>dim){ cd=1; cm++; if(cm>12){ cm=1; cy++; } }
  };
  let guard = 0;
  while(guard++ < 400){
    const dstr = `${cy}-${String(cm).padStart(2,'0')}-${String(cd).padStart(2,'0')}`;
    if(dstr > end) break;
    const isFuture = dstr > hoje;
    const items = isFuture ? (projByDay[dstr]||[]).map(x=>({descricao:x.descricao, valor:x.valor})) :
                              (realByDay[dstr]||[]).map(x=>({descricao:x.descricao, valor:x.valor}));
    const entradas = items.filter(x=>x.valor>0).reduce((s,x)=>s+x.valor,0);
    const saidas = items.filter(x=>x.valor<0).reduce((s,x)=>s+Math.abs(x.valor),0);
    const saldoInicial = saldo;
    saldo = Math.round((saldo + entradas - saidas)*100)/100;
    out.push({data:dstr, saldoInicial, entradas, saidas, saldoFinal:saldo, items, isFuture});
    nextDay();
  }
  return out;
}

// Grade de calendário do mês (domingo a sábado) com receitas/despesas por dia de vencimento —
// reaproveita os mesmos dados diários (rows) já calculados por computeDailyCashflow().
function calendarioFluxo(rows, month){
  const byDate = {};
  rows.forEach(r=>{ byDate[r.data] = r; });
  const [y,m] = month.split('-').map(Number);
  const dim = daysInMonth(month);
  const firstWeekday = new Date(y, m-1, 1).getDay(); // 0=domingo
  const totalCells = firstWeekday + dim;
  const trailing = (7 - (totalCells % 7)) % 7;
  const weekdays = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let cells = '';
  for(let i=0;i<firstWeekday;i++) cells += `<div class="calday pad"></div>`;
  for(let d=1; d<=dim; d++){
    const dstr = `${month}-${String(d).padStart(2,'0')}`;
    const r = byDate[dstr];
    const isToday = dstr === dataBase();
    const entradas = r ? r.entradas : 0;
    const saidas = r ? r.saidas : 0;
    const itemsReceita = r ? r.items.filter(x=>x.valor>0) : [];
    const itemsDespesa = r ? r.items.filter(x=>x.valor<0) : [];
    const tipReceita = itemsReceita.map(x=>`${x.descricao}: ${fmt(x.valor)}`).join(' · ') || 'Receita';
    const tipDespesa = itemsDespesa.map(x=>`${x.descricao}: ${fmt(Math.abs(x.valor))}`).join(' · ') || 'Despesa';
    cells += `<div class="calday ${r&&r.isFuture?'future':''} ${isToday?'today':''}">
      <div class="calnum">${d}${isToday?' <span class="daybadge">hoje</span>':''}</div>
      ${entradas>0 ? `<div class="calamt pos" data-tip="${tipReceita}">+${fmt(entradas)}</div>` : ''}
      ${saidas>0 ? `<div class="calamt neg" data-tip="${tipDespesa}">-${fmt(saidas)}</div>` : ''}
    </div>`;
  }
  for(let i=0;i<trailing;i++) cells += `<div class="calday pad"></div>`;
  return `<div class="calgrid">
    ${weekdays.map(w=>`<div class="calweekday">${w}</div>`).join('')}
    ${cells}
  </div>`;
}
function saldoLineChart(rows, minV, maxV){
  const w = Math.max(600, rows.length*26), h=160, pad=28;
  const range = (maxV-minV) || 1;
  const x = i => pad + i*((w-2*pad)/(rows.length-1||1));
  const y = v => h-pad - ((v-minV)/range)*(h-2*pad);
  let path = rows.map((r,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(r.saldoFinal).toFixed(1)}`).join(' ');
  const zeroY = y(0);
  const dots = rows.map((r,i)=>`<circle data-tip="${fmtDate(r.data)} · Saldo: ${fmt(r.saldoFinal)}" cx="${x(i).toFixed(1)}" cy="${y(r.saldoFinal).toFixed(1)}" r="4" fill="${r.isFuture?cssVar('--s2'):cssVar('--s1')}" stroke="${cssVar('--surface-1')}" stroke-width="2"></circle>`).join('');
  return `<div style="overflow-x:auto"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="min-width:100%">
    ${minV<0 && maxV>0 ? `<line x1="${pad}" y1="${zeroY}" x2="${w-pad}" y2="${zeroY}" stroke="${cssVar('--grid')}" stroke-dasharray="3,3"/>` : ''}
    <path d="${path}" fill="none" stroke="${cssVar('--s1')}" stroke-width="2"/>
    ${dots}
  </svg></div>`;
}

    <div class="card">
      <h2>Dia de vencimento da fatura</h2>
      <div class="sub" style="margin:-4px 0 10px;">Cadastre aqui o dia do mês em que a fatura deste cartão vence — isso é usado para projetar a fatura no Fluxo de Caixa e sinalizar o vencimento em Em Aberto.</div>
      <div class="formrow">
        <div><label>Dia de vencimento (1-31)</label><input type="number" min="1" max="31" step="1" data-venc-dia="${cardId}" value="${card.diaVencimento||''}" placeholder="ex: 10"></div>
      </div>
    </div>`;

  if(invoices.length===0) return vencBox + `<div class="card"><div class="empty">Nenhuma fatura carregada para este cartão ainda.</div></div>`;

  // histórico (barra) de totais por fatura
  const totals = invoices.map(m=>({m, total: byInvoice[m].reduce((s,l)=>s+Math.abs(Math.min(l.valor,0)),0)}));
  const maxT = Math.max(...totals.map(t=>t.total),1);

  const histHtml = `
    <div class="card">
      <h2>Histórico de faturas <small>${card.name}${card.limite?` · limite R$ ${card.limite.toLocaleString('pt-BR',{minimumFractionDigits:2})}`:''}</small></h2>
      ${totals.map(t=>`
        <div class="barrow">
          <div class="lbl">${monthLabel(t.m)}</div>
          <div class="track"><div class="fill" style="width:${(t.total/maxT*100).toFixed(1)}%; background:${slotColor(0)}"></div></div>
          <div class="num">${fmt(t.total)}</div>
        </div>`).join('')}
    </div>`;

  const invoiceHtml = invoices.map(m=>{
    const list = byInvoice[m].slice().sort((a,b)=>a.data.localeCompare(b.data));
    const total = list.reduce((s,l)=>s+Math.abs(Math.min(l.valor,0)),0);
    const creditos = list.reduce((s,l)=>s+Math.max(l.valor,0),0);
    const venc = cardVencDate(cardId, m);
    return `<details class="invoice" ${m===invoices[0]?'open':''}>
      <summary><span>${monthLabel(m)} ${venc?`· vencimento ${fmtDate(venc)}`:'· <span class="sub">sem dia de vencimento cadastrado</span>'}</span><span class="tot">${fmt(total-creditos)}</span></summary>
      <div class="body">
        <div class="tblwrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Competência</th><th style="text-align:right">Valor</th><th></th></tr></thead>
        <tbody>
        ${list.map(l=>`<tr>
          <td>${fmtDate(l.data)}</td>
          <td>${l.descricao}</td>
          <td>${categoriaCellHTML(l)}</td>
          <td>${competenciaCellHTML(l)}</td>
          <td style="text-align:right" class="${l.valor>=0?'val-pos':'val-neg'}">${fmt(l.valor)}</td>
          <td><button class="btn danger" style="padding:4px 9px; font-size:11.5px" data-del-lanc="${l.id}">Excluir</button></td>
        </tr>`).join('')}
        </tbody></table></div>
      </div>
    </details>`;
  }).join('');

  return vencBox + histHtml + `<div class="card"><h2>Itens por fatura</h2>${invoiceHtml}</div>`;
}

// ===================== Extratos por conta =====================
function viewExtratos(){
  return `
    <div class="topbar">
      <div><h1>Extratos por conta</h1><div class="sub">Lançamentos das contas correntes, com saldo estimado ao longo do período</div></div>
      <select data-account-select id="selAccount">${state.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select>
    </div>
    <div id="extratoBody"></div>
  `;
}
function render_extratoFor(accId){
  const el = document.getElementById('extratoBody');
  el.innerHTML = extratoBodyHTML(accId || state.accounts[0].id);
  wireLinhasLancamento(el);
}
function extratoBodyHTML(accId){
  const acc = accById(accId);
  const list = state.lancamentos.filter(l=>l.origemTipo==='conta' && l.origemId===accId).slice().sort((a,b)=>a.data.localeCompare(b.data) || a.id-b.id);
  if(list.length===0) return `<div class="card"><div class="empty">Nenhum lançamento para esta conta ainda.</div></div>`;
  const net = list.reduce((s,l)=>s+l.valor,0);
  const saldoInicial = Math.round((acc.saldoAtual - net)*100)/100;
  let running = saldoInicial;
  const rows = list.map(l=>{ running = Math.round((running+l.valor)*100)/100; return {...l, saldo:running}; });
  return `
    <div class="tiles">
      <div class="tile"><div class="label">Saldo estimado no início do período</div><div class="value">${fmt(saldoInicial)}</div></div>
      <div class="tile"><div class="label">Saldo atual (${fmtDate(acc.dataExtrato)})</div><div class="value">${fmt(acc.saldoAtual)}</div></div>
      <div class="tile"><div class="label">Movimentação líquida no período</div><div class="value ${net>=0?'pos':'neg'}">${fmt(net)}</div></div>
    </div>
    <div class="card">
      <h2>Extrato <small>${acc.name} · ${acc.banco}</small></h2>
      <div class="sub" style="margin:-6px 0 12px;">Ajuste a categoria (e a competência, se for diferente da data) direto na linha do lançamento.</div>
      <div class="tblwrap"><table>
        <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Competência</th><th style="text-align:right">Valor</th><th style="text-align:right">Saldo</th><th></th></tr></thead>
        <tbody>
        ${rows.map(l=>`<tr>
          <td>${fmtDate(l.data)}</td>
          <td>${l.descricao}</td>
          <td>${categoriaCellHTML(l)}</td>
          <td>${competenciaCellHTML(l)}</td>
          <td style="text-align:right" class="${l.valor>=0?'val-pos':'val-neg'}">${fmt(l.valor)}</td>
          <td style="text-align:right">${fmt(l.saldo)}</td>
          <td><button class="btn danger" style="padding:4px 9px; font-size:11.5px" data-del-lanc="${l.id}">Excluir</button></td>
        </tr>`).join('')}
        </tbody>
      </table></div>
    </div>
  `;
}

// ===================== Empréstimos (valores emprestados a terceiros) =====================
function viewEmprestimos(){
  const hoje = dataBase();
  const lista = [...state.emprestimos].sort((a,b)=>b.data.localeCompare(a.data));
  const abertos = lista.filter(e=>e.status!=='quitado');
  const totalAberto = abertos.reduce((s,e)=>s+e.valor,0);
  const atrasados = abertos.filter(e=>e.vencimento && e.vencimento<hoje);
  return `
    <div class="topbar">
      <div><h1>Empréstimos</h1><div class="sub">Valores que você emprestou a outras pessoas — o dinheiro sai da conta na hora e fica registrado aqui até ser devolvido</div></div>
    </div>
    <div class="tiles">
      <div class="tile"><div class="label">Total emprestado em aberto</div><div class="value neg">${fmt(totalAberto)}</div></div>
      <div class="tile"><div class="label">Empréstimos em atraso</div><div class="value ${atrasados.length?'neg':''}">${atrasados.length}</div></div>
      <div class="tile"><div class="label">Total já registrado (todos os tempos)</div><div class="value">${fmt(lista.reduce((s,e)=>s+e.valor,0))}</div></div>
    </div>
    <div class="card">
      <h2>Novo empréstimo</h2>
      <div class="sub" style="margin:-6px 0 12px;">Ao salvar, o valor é debitado imediatamente da conta escolhida.</div>
      <form id="formEmprestimo">
        <div class="formrow">
          <div><label>Nome de quem recebeu</label><input type="text" name="nome" placeholder="Ex: João" required></div>
          <div><label>Valor</label><input type="number" step="0.01" min="0.01" name="valor" placeholder="500.00" required></div>
          <div><label>Data</label><input type="date" name="data" required value="${dataBase()}"></div>
          <div><label>Prazo (quando devem te pagar)</label><input type="date" name="vencimento"></div>
          <div><label>Conta de origem</label><select name="contaId">${state.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>
          <div><button class="btn" type="submit">Registrar empréstimo</button></div>
        </div>
      </form>
    </div>
    <div class="card">
      <h2>Empréstimos registrados</h2>
      ${lista.length===0 ? '<div class="empty">Nenhum empréstimo registrado ainda.</div>' : `
      <div class="tblwrap"><table>
        <thead><tr><th>Data</th><th>Para quem</th><th style="text-align:right">Valor</th><th>Prazo</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${lista.map(e=>{
          const atrasado = e.status!=='quitado' && e.vencimento && e.vencimento<hoje;
          return `<tr>
            <td>${fmtDate(e.data)}</td>
            <td>${e.nome}</td>
            <td style="text-align:right">${fmt(e.valor)}</td>
            <td>${e.vencimento?fmtDate(e.vencimento):'—'}</td>
            <td><span class="pill ${e.status==='quitado'?'good':(atrasado?'late':'warn')}">${e.status==='quitado'?`Recebido em ${fmtDate(e.dataQuitacao)}`:(atrasado?'⚠ Atrasado':'Em aberto')}</span></td>
            <td>${e.status!=='quitado' ? `<button class="btn secondary" style="padding:4px 9px; font-size:11.5px" data-receber="${e.id}">✅ Marcar como recebido</button>` : ''}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>`}
    </div>
  `;
}
function wireEmprestimos(){
  document.getElementById('formEmprestimo').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const valor = Math.round(Math.abs(parseFloat(fd.get('valor')))*100)/100;
    const contaId = fd.get('contaId');
    const acc = accById(contaId);
    if(!valor || !acc) return;
    const emprestimo = {
      id: emprestimoUid(), nome: fd.get('nome'), valor, data: fd.get('data'),
      vencimento: fd.get('vencimento') || null, contaId, status: 'aberto',
    };
    state.emprestimos.push(emprestimo);
    state.lancamentos.push({
      id: uid(), data: emprestimo.data, origemTipo:'conta', origemId: contaId, categoriaId:'sys_emprestimo',
      descricao: `Empréstimo concedido a ${emprestimo.nome}`, valor: -valor, fatura:null, vencimento: emprestimo.vencimento,
      competencia: emprestimo.data.slice(0,7), emprestimoId: emprestimo.id,
    });
    acc.saldoAtual = Math.round((acc.saldoAtual - valor)*100)/100;
    render();
  });
  document.querySelectorAll('[data-receber]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const emp = state.emprestimos.find(e=>e.id===parseInt(btn.dataset.receber));
      if(!emp) return;
      const acc = accById(emp.contaId);
      const hoje = dataBase();
      state.lancamentos.push({
        id: uid(), data: hoje, origemTipo:'conta', origemId: emp.contaId, categoriaId:'sys_emprestimo',
        descricao: `Recebimento de empréstimo — ${emp.nome}`, valor: emp.valor, fatura:null, vencimento:null,
        competencia: hoje.slice(0,7), emprestimoId: emp.id,
      });
      if(acc) acc.saldoAtual = Math.round((acc.saldoAtual + emp.valor)*100)/100;
      emp.status = 'quitado';
      emp.dataQuitacao = hoje;
      render();
    });
  });
}

// ===================== Delegated hover tooltips (bars) =====================
document.addEventListener('mousemove', (e)=>{
  const t = e.target.closest('[data-tip]');
  if(t){ showTip(e, t.getAttribute('data-tip')); }
  else hideTip();
});
document.addEventListener('mouseleave', hideTip, true);

// ===================== Init =====================
render();
setTimeout(()=>{ // populate default selects after first paint if user lands on those tabs later
}, 0);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* ex: rodando de file:// localmente */ });
  });
}

</script>
